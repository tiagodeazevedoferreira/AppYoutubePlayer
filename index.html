<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0f0f0f">
  <meta name="description" content="Player de playlist do YouTube que funciona com a tela desligada">
  
  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="assets/icon-192.png">
  
  <title>YT Playlist Player</title>
  
  <link rel="stylesheet" href="css/style.css">
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-database-compat.js"></script>
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="header">
      <h1>YT Playlist</h1>
      <button id="btn-new-playlist" class="btn btn-primary" title="Nova playlist">+</button>
    </header>

    <!-- Lista de Playlists -->
    <section id="playlists-view" class="view active">
      <div id="playlists-list" class="playlists-list">
        <!-- Preenchido via JS -->
      </div>
      <p id="empty-playlists" class="empty-state">Nenhuma playlist ainda.<br>Clique no + para criar.</p>
    </section>

    <!-- Player View -->
    <section id="player-view" class="view">
      <div class="player-container">
        <div id="youtube-player"></div>
        
        <div class="now-playing">
          <h2 id="current-title">Nenhum vídeo</h2>
          <p id="current-playlist-name"></p>
        </div>

        <div class="controls">
          <button id="btn-prev" class="btn-control" title="Anterior">⏮</button>
          <button id="btn-play-pause" class="btn-control btn-play" title="Play/Pause">▶</button>
          <button id="btn-next" class="btn-control" title="Próximo">⏭</button>
        </div>

        <div class="progress-container">
          <div id="progress-bar" class="progress-bar">
            <div id="progress-fill" class="progress-fill"></div>
          </div>
          <div class="time">
            <span id="current-time">0:00</span>
            <span id="duration">0:00</span>
          </div>
        </div>

        <div class="queue">
          <h3>Fila</h3>
          <ul id="queue-list"></ul>
        </div>

        <button id="btn-back" class="btn btn-secondary">← Voltar</button>
      </div>
    </section>

    <!-- Modal Nova/Editar Playlist -->
    <div id="modal" class="modal hidden">
      <div class="modal-content">
        <h2 id="modal-title">Nova Playlist</h2>
        
        <label for="playlist-name">Nome da playlist</label>
        <input type="text" id="playlist-name" placeholder="Ex: Treino, Estudo, Relax...">

        <label>Vídeos do YouTube</label>
        <div id="videos-inputs">
          <!-- inputs dinâmicos -->
        </div>
        <button id="btn-add-video" class="btn btn-secondary btn-sm">+ Adicionar vídeo</button>

        <div class="modal-actions">
          <button id="btn-cancel" class="btn btn-secondary">Cancelar</button>
          <button id="btn-save-playlist" class="btn btn-primary">Salvar</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="js/firebase.js"></script>
  <script src="js/playlist.js"></script>
  <script src="js/player.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
